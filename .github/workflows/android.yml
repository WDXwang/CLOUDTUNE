name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.CLOUDTUNE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.CLOUDTUNE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLOUDTUNE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLOUDTUNE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::CLOUDTUNE_KEYSTORE_B64 未配置，本次使用默认 debug 签名"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cloudtune.jks"
          {
            echo "cloudtune.storeFile=$RUNNER_TEMP/cloudtune.jks"
            echo "cloudtune.storePassword=$STORE_PASSWORD"
            echo "cloudtune.keyAlias=$KEY_ALIAS"
            echo "cloudtune.keyPassword=$KEY_PASSWORD"
          } >> local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CloudTune-${{ github.ref_name }}.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "CloudTune-${{ github.ref_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudTune-apk
          path: CloudTune-${{ github.ref_name }}.apk
          retention-days: 30

      - name: Publish Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: CloudTune-${{ github.ref_name }}.apk
